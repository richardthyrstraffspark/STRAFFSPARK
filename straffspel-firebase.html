}
function victory(s,w){
 const N=!(M&&M.tod==="day"),c=M.c[w],sd=w*40+5,SE=[sd,sd+13,sd+29,sd+41,sd+57],XS=[28,54,80,106,132],P=(x,y,pose,sc,seed,rot,lift)=>big(x,y,c,pose,sc,s*1000,seed,rot,lift);
 const CC=["#e03131","#fcc419","#f8f9fa","#1c7ed6","#7048e8","#2f9e44","#f76707","#e64980","#adb5bd"];
 R(0,0,160,100,N?"#0b1330":"#4aa3e8");
 for(let j=0;j<13;j++)for(let i=0;i<40;i++){const v=(i*7+j*13)%9,b=(Math.floor(s*5+i*3+j)%4===0)?-1:0;
  R(i*4,j*4+2+b,4,2,CC[v]);R(i*4+1,j*4+b,2,2,"#f2b880");
  if(v%3===0&&Math.floor(s*6+i)%2)R(i*4,j*4-2+b,1,2,"#f2b880")}
 if(N)R(0,0,160,52,"rgba(0,10,40,.5)");
 for(let i=0;i<20;i++)R(i*8,52,8,6,N?(i%2?"#1b1b1b":"#e8590c"):(i%2?"#f8f9fa":"#d9480f"));
 R(0,52,160,1,"#000");R(0,58,160,42,N?"#1f6b34":"#2e9b3f");
 {let y=58,h=5,i=0;while(y<100){if(i%2)R(0,y,160,h,N?"#257a3d":"#38b04a");y+=h;h+=2;i++}}
 for(let i=0;i<5;i++){
  const st=i<3?-30-i*25:190+(i-3)*25,a=eo(cl((s-.15*i)/1.4)),x=lerp(st,XS[i],a),arr=a<1;
  if(i===3&&arr)for(let j=1;j<7;j++){const z=Math.max(2,6-j*.6);R(x+12+j*6,92-(j%3)*3,z,z,"#e9ddb5")}
  if(i===2&&s>2){const q=cl((s-2)/1.6),q2=(q*2)%1;
   if(q<1)P(x,94,"tuck",2,SE[i],-Math.PI/2*Math.floor(q2*4),Math.sin(Math.PI*q2)*14);else P(x,94,"cheer",2,SE[i])}
  else P(x,94,arr?(i===3?"slide":"run"):"cheer",2,SE[i]);
 }
 if(s>2.6){const e=eo(cl((s-2.6)/1)),ty=lerp(100,18,e);
  R(71,ty-1,18,12,"#000");R(72,ty,16,10,"#fcc419");R(68,ty+1,4,6,"#fcc419");R(88,ty+1,4,6,"#fcc419");R(75,ty+10,10,5,"#e0a800");R(72,ty+15,16,3,"#fcc419");R(75,ty+2,3,5,"#fff3bf")}
 for(let i=0;i<60;i++)R((i*53)%160+Math.sin(s*3+i)*3,((s*45+i*29)%110)-5,2,2,CC[i%9]);
 R(0,0,160,8,"#000");R(0,92,160,8,"#000");
 if(s<.12)R(0,0,160,100,"rgba(255,255,255,.6)");
}
function render(s,k,goal,cel,fin){
 const b=$("bn");
 if(fin>=0&&s>=3.8){victory(s-3.8,fin);b.style.top="12%";b.innerHTML=s>4?"SEGER!<br><span style=\"font-size:10px\">"+nm(fin)+"</span>":""}
 else{scene(frameOf(s,k,goal,cel));b.style.top="38%";b.textContent=s>1.05?(goal?"MÅL!":"RÄDDAT!"):""}
}
const fb=i=>((i*37+11)%98)+2;
function pickNum(who){const u=M.kicks.filter(k=>k.s===who&&k.num).map(k=>k.num);let n;do{n=2+Math.floor(Math.random()*98)}while(u.includes(n));return n}
function dnum(st){if(st.need==="shoot"&&st.who===idx)return nextNum||undefined;if(st.need==="save"){const i=M.kicks.length-1;return M.kicks[i].num||fb(i)}}
function frameOf(s,k,goal,cel){
 const sh=k.s,ke=1-k.s,bt=zc(k.shot),kt=zc(k.save),d=kt.x<70?-1:kt.x>90?1:0;
 const fu=cl((s-.55)/.45),dp=eo(cl((s-.6)/.4));
 const bx=lerp(80,bt.x,fu);let by=lerp(82,bt.y,fu)-Math.sin(Math.PI*fu)*5;
 if(!goal&&s>1.05)by=bt.y+Math.pow(cl((s-1.05)/.45),2)*(58-bt.y);
 let kp="idle",kx=80,ky=60;
 if(s>.6){kp="dive";kx=lerp(80,kt.x,dp);ky=lerp(60,d===0?(kt.y<40?52:60):kt.y+7,dp)}
 if(s>1){kx=kt.x;if(goal){ky=lerp(ky,60,cl((s-1)/.3));if(s>1.3){kp="sad";ky=60}}else{kp="cheer";ky=60}}
 let sx=72,sy=97,sp="idle",dust=[],rot=0,lift=0;
 if(s<.4)sx=lerp(58,72,s/.4);
 if(s>=.4&&s<.8)sp="kick";
 if(goal){
  if(s>=1&&s<1.1)sp="cheer";
  if(s>=1.1){
   if(cel===0){const p=cl((s-1.1)/1.3),e=eo(p);sp="slide";sx=lerp(72,24,e);sy=lerp(97,98,e);
    if(p<1)for(let j=1;j<7;j++){const z=Math.max(1,5-j*.6);dust.push({x:sx+j*5,y:sy-1-(j%2)*2,s:z})}}
   else if(cel===1){const q=cl((s-1.1)/1.7),a=cl(q/.45);sp=q<1?"run":"cheer";sx=lerp(72,10,a);sy=q<.45?97:lerp(97,30,(q-.45)/.55)}
   else{const q=cl((s-1.1)/1.4),q2=(q*2)%1;sx=lerp(72,50,q);
    if(q<1){rot=-Math.PI/2*Math.floor(q2*4);lift=Math.sin(Math.PI*q2)*16;sp="tuck"}else sp="cheer"}
  }
 }else if(s>=1.05){sp="sad";sy=97+Math.sin(s*2.5)*.7}
 const fx={bar:6*cl((s-1)/.3)};
 if(goal&&s>1&&s<1.35)fx.shake=true;
 if(goal&&s>1&&s<1.12)fx.flash=true;
 if(!goal&&s>1)fx.dim=.28*cl((s-1)/.6);
 return{tk:s*1000,grid:false,fx,dust,sx,sy,keeper:{idx:ke,c:M.c[ke],pose:kp,x:kx,y:ky,d},shooter:{idx:sh,c:M.c[sh],pose:sp,num:k.num,rot,lift},ball:{x:bx,y:by}};
}
function play(li){
 playing=true;sel=-1;$("ok").classList.add("hide");
 const gs=[0,0];M.kicks.slice(0,li+1).forEach(x=>{if(x.save!==undefined&&x.shot!==x.save)gs[x.s]++});
 const fin=((li+1)>=10&&(li+1)%2===0&&gs[0]!==gs[1])?(gs[0]>gs[1]?0:1):-1;
 const k0=M.kicks[li],k={...k0,num:k0.num||fb(li)},goal=k.shot!==k.save,cel=(li+k.num)%3,t0=performance.now();
 $("st").innerHTML=nm(k.s)+" SLÅR...";
 (function loop(now){
  const s=(now-t0)/1000;
  if(s>=(fin>=0?9.8:3.8)){ack=li;ls("ack_"+code,String(li));playing=false;$("bn").textContent="";check();return}
  render(s,k,goal,cel,fin);
  requestAnimationFrame(loop);
 })(t0);
}
function demo(c){
 M={p:["d","e"],kicks:[],c:[PAL[0],PAL[1]],n:["DEMO","DEMO"],tod:"night"};idx=0;playing=false;
 $("lobby").classList.add("hide");$("game").classList.remove("hide");
 $("score").textContent="JUBEL: "+["KNÄGLIDNING","SPURT MOT PUBLIKEN","VOLT","SEGERFIRANDE MED HELA LAGET"][c];$("st").textContent="SPELAS I LOOP";$("ok").classList.add("hide");
 const my=++demoOn,k={s:0,shot:0,save:3,num:10+c*13};let t0=performance.now();
 (function loop(now){
  if(demoOn!==my||!M)return;
  let s=(now-t0)/1000;if(s>(c===3?6.5:3.8)){t0=now;s=0}
  if(c===3){victory(s,0);$("bn").style.top="12%";$("bn").innerHTML=s>.2?"SEGER!":""}else render(s,k,true,c,-1);
  requestAnimationFrame(loop);
 })(t0);
}
cv.addEventListener("pointerdown",e=>{
 if(!M||playing||busy)return;const st=state();if(st.who!==idx||(st.need!=="shoot"&&st.need!=="save"))return;
 const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*160/r.width,y=(e.clientY-r.top)*100/r.height;
 if(x<GX||x>GX+GW||y<GY||y>GY+42)return;
 sel=Math.floor((x-GX)/CW)+3*Math.floor((y-GY)/CH);ui();
});
cv.addEventListener("pointermove",e=>{
 if(playing||!M||e.pointerType==="touch")return;
 const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*160/r.width,y=(e.clientY-r.top)*100/r.height;
 const h=(x<GX||x>GX+GW||y<GY||y>GY+42)?-1:Math.floor((x-GX)/CW)+3*Math.floor((y-GY)/CH);
 if(h!==hover){hover=h;draw()}
});
$("ok").onclick=async()=>{
 const st=state();
 if(st.need==="over"){leave();return}
 if(sel<0||busy)return;
 busy=true;const K=M.kicks.slice();
 if(st.need==="shoot"){K.push({s:idx,shot:sel,num:nextNum||pickNum(idx)});nextNum=0}else K[K.length-1]={...K[K.length-1],save:sel};
 try{await ref.update({kicks:K})}catch(e){$("st").textContent="KUNDE INTE SPARA. FÖRSÖK IGEN."}
 sel=-1;busy=false;ui();
};

async function loadNames(){}
function listen(){
 if(unsub)unsub();
 unsub=ref.onSnapshot(async s=>{if(!s.exists)return;M=s.data();M.c=M.c||[PAL[0],PAL[1]];M.n=M.n||[];await loadNames();check()},e=>{$("err").textContent="FEL: "+e.message});
}
function enter(){
 $("lobby").classList.add("hide");$("game").classList.remove("hide");
 ack=parseInt(ls("ack_"+code)||"-1",10);ls("last",code);listen();
}
function leave(){
 demoOn++;
 if(unsub)unsub();unsub=null;M=null;ls("last",null);code="";
 $("game").classList.add("hide");$("lobby").classList.remove("hide");$("err").textContent="";
}
async function join(c){
 const err=m=>$("err").textContent=m;
 if(!db)return err(NOLOGIN);
 c=(c||"").trim().toUpperCase();if(!c)return err("ANGE EN KOD.");
 try{
  ref=db.doc("matches/"+c);const s=await ref.get();
  if(!s.exists)return err("HITTAR INGEN MATCH MED KODEN "+c+".");
  const m=s.data();
  if(m.p[0]===meId)idx=0;else if(m.p[1]===meId)idx=1;
  else if(!m.p[1]){const c0=(m.c||[])[0],c2=PAL[myCol]!==c0?PAL[myCol]:PAL.find(x=>x!==c0);
   await ref.update({p:[m.p[0],meId],n:[(m.n||[])[0]||"SPELARE 1",myName()],c:[c0||PAL[0],c2],open:false});idx=1}
  else return err("MATCHEN ÄR REDAN FULL.");
  code=c;enter();
 }catch(e){err("KUNDE INTE GÅ MED: "+(e.message||e.code))}
}
const myName=()=>($("nm").value.trim()||"SPELARE").toUpperCase().slice(0,10);
async function mkMatch(open){
 if(!db)return $("err").textContent=NOLOGIN;
 ls("name",myName());
 const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let c="";for(let i=0;i<5;i++)c+=A[Math.floor(Math.random()*A.length)];
 try{ref=db.doc("matches/"+c);await ref.set({p:[meId,null],n:[myName(),null],c:[PAL[myCol],null],open,tod:myTod,kicks:[],t:Date.now()});idx=0;code=c;enter()}
 catch(e){$("err").textContent="KUNDE INTE SKAPA MATCH: "+(e.message||e.code)}
}
$("mk").onclick=()=>mkMatch(true);$("mkp").onclick=()=>mkMatch(false);
function renderTd(){const el=$("td");el.innerHTML="";[["day","DAG"],["night","KVÄLL"]].forEach(([v,l])=>{const b=document.createElement("button");b.textContent=l;b.style.opacity=myTod===v?1:.45;b.onclick=()=>{myTod=v;ls("tod",v);renderTd()};el.appendChild(b)})}
function renderSw(){const el=$("sw");el.innerHTML="";PAL.forEach((c,i)=>{const b=document.createElement("button");b.className="sw"+(i===myCol?" on":"");b.style.background=c;b.setAttribute("aria-label","Färg "+(i+1));b.onclick=()=>{myCol=i;ls("col",String(i));renderSw()};el.appendChild(b)})}
function renderOpen(docs){
 const el=$("ol");el.innerHTML="";let n=0;
 docs.forEach(d=>{const m=d.data();if(!m||!m.p||m.p[1]||Date.now()-(m.t||0)>43200000)return;n++;
  const r=document.createElement("div");r.className="ml";
  const l=document.createElement("span");l.textContent=((m.n||[])[0]||"SPELARE 1")+" · "+(m.tod==="day"?"DAG":"KVÄLL");l.style.borderLeft="10px solid "+((m.c||[])[0]||PAL[0]);l.style.paddingLeft="6px";
  const b=document.createElement("button");b.textContent=m.p[0]===meId?"ÖPPNA":"GÅ MED";b.onclick=()=>{ls("name",myName());join(d.id)};
  r.append(l,b);el.appendChild(r)});
 if(!n)el.textContent="INGA ÄNNU";
}
function renderMine(docs){
 const el=$("ml");el.innerHTML="";let n=0;
 docs.forEach(d=>{const m=d.data();if(!m||!m.p)return;n++;
  const dn=(m.kicks||[]).filter(k=>k.save!==undefined).length,o=m.p[0]===meId?1:0;
  const r=document.createElement("div");r.className="ml";
  const l=document.createElement("span");l.textContent=(m.p[1]?"MOT "+((m.n||[])[o]||"?"):"VÄNTAR PÅ MOTSPELARE")+" · "+dn+"/10 · "+d.id;
  const b=document.createElement("button");b.textContent="ÖPPNA";b.onclick=()=>{ls("name",myName());join(d.id)};
  r.append(l,b);el.appendChild(r)});
 if(!n)el.textContent="INGA ÄNNU";
}
$("jn").onclick=()=>join($("ci").value);
[0,1,2,3].forEach(i=>{$("g"+i).onclick=()=>demo(i)});
$("lv").onclick=leave;

(async()=>{
 scene({tk:0,grid:false,keeper:{idx:1,c:PAL[1],pose:"idle",x:80,y:60,d:0},shooter:{idx:0,c:PAL[0],pose:"idle"},ball:{x:80,y:82}});
 $("nm").value=ls("name")||"";myCol=parseInt(ls("col")||"0",10)||0;renderSw();myTod=ls("tod")==="day"?"day":"night";renderTd();
 try{await signInAnonymously(fbAuth);meId=fbAuth.currentUser.uid;db=dbA;usr=null}catch(e){console.error(e)}
 if(db&&!$("nm").value){try{const me=await usr.me();$("nm").value=(me.name||"").toUpperCase().slice(0,10)}catch(e){}}
 if(!db||!meId){db=null;$("err").textContent=NOLOGIN;return}
 let h="";try{h=(location.hash||"").replace("#","")}catch(e){}
 db.collection("matches").where("open","==",true).limit(30).onSnapshot(sn=>renderOpen(sn.docs),e=>{});
 db.collection("matches").where("p","array-contains",meId).limit(20).onSnapshot(sn=>renderMine(sn.docs),e=>{});
 const c=h||ls("last");if(c)join(c);
})();
