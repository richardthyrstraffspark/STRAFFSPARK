  if(P.r===R2.length-1){u.st="done";u.win=win}
  else{const nx=R2[P.r+1].st+Math.floor(P.j/2),slot=P.j%2?"b":"a",o=(t.m||{})[nx]||{},os=slot==="a"?o.b:o.a;
